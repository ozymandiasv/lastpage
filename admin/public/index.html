<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Last Page — Admin</title>
<link rel="stylesheet" href="/admin.css">
<link rel="icon" href="data:,">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-box">
    <div class="login-title">Last Page</div>
    <div class="login-sub">Admin — local access only</div>
    <input type="password" id="loginPassword" placeholder="Password" autofocus>
    <button type="submit">Sign in</button>
    <div id="loginError" class="login-error"></div>
  </form>
</div>

<div id="app" class="app hidden">
  <header class="mobile-topbar">
    <div class="mobile-logo">Last Page<span>Admin</span></div>
    <div class="mobile-actions">
      <a href="/preview/" target="_blank" rel="noopener" class="tb-btn" aria-label="View site">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
      </a>
      <button class="tb-btn theme-toggle" type="button" aria-label="Toggle light or dark mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span></span>
      </button>
      <button class="tb-btn logout-btn" type="button" aria-label="Sign out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-logo">Last Page<span>Admin</span></div>
    <button class="theme-toggle desk-only" type="button" aria-label="Toggle light mode">☼ <span>Light mode</span></button>
    <nav class="sidebar-nav">
      <a href="#/dashboard" data-route="dashboard"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>Dashboard</span></a>
      <a href="#/posts" data-route="posts"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg><span>Posts</span></a>
      <a href="#/pages" data-route="pages"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>Pages</span></a>
      <a href="#/media" data-route="media"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-5-5L5 21"/></svg><span>Media</span></a>
      <a href="#/git" data-route="git"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg><span class="lbl-full">Git &amp; Publish</span><span class="lbl-short">Publish</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="/preview/" target="_blank" rel="noopener" class="preview-link">View site ↗</a>
      <button class="logout-btn desk-only" type="button">Sign out</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script src="/admin.js"></script>
</body>
</html>
